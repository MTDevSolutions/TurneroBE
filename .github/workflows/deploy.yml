# Deploy de Turnix a produccion (VPS Hetzner): solo en push a main. Copiado de CellFixBE.
#   1. Tests.  2. Construye la imagen y la sube a GHCR (tag = sha del commit).
#   3. Por SSH, el VPS ejecuta scripts/deploy.sh (backup, pull de la imagen, healthcheck, rollback).
# Setup unico (clave SSH, secrets, docker login): docs/deploy-vps.md, seccion "Deploy automatico".
name: Deploy

on:
  push:
    branches: [main]

# Un deploy a la vez; si entra otro push, espera a que termine el actual (no se cancela a mitad).
concurrency:
  group: deploy-produccion-turnix
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: dotnet test Tests/Tests.csproj --configuration Release

  imagen:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # GHCR exige el nombre de la imagen en minusculas.
      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: imagen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # La clave del CI esta restringida en el VPS (authorized_keys) a ejecutar solo scripts/deploy.sh;
      # lo que se manda por SSH (el sha) llega al script como argumento y ahi se valida.
      - name: Deploy por SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "$GITHUB_SHA"
